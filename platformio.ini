; Rôle : Configure la carte, les dépendances et les options de compilation de PlatformIO.
; Configuration du projet PlatformIO
;
;   Compilation : options du compilateur et filtre des sources
;   Téléversement : port, vitesse et options supplémentaires
;   Bibliothèques : dépendances et emplacements supplémentaires
;   Options avancées : scripts supplémentaires
;
; Consulter la documentation pour les autres options et les exemples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_l476rg]
platform = ststm32@19.4.0
board = nucleo_l476rg
framework = stm32cube
board_build.ldscript = linker.ld
board_build.stm32cube.custom_config_header = yes
upload_protocol = stlink
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
	-Wl,-u,_printf_float
    -Ilib/fatfs
    -Ilib/bosch_bme280
    -Ilib/cesi_grove/include
    -DBME280_DOUBLE_ENABLE
    -Wall
    -Wextra
    -Wno-unused-parameter
